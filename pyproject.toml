[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "mini-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_sandbox_core", "mcp_fs_server", "mcp_github_server", "mcp_gateway"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pydeps>=3.0.8",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
