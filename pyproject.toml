[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "mini-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_sandbox_core", "mcp_fs_server"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
